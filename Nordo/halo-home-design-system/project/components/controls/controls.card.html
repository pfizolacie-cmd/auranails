<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px;background:url('../../assets/backdrop-room-warm.jpg') center/cover fixed,var(--espresso-800);font:var(--text-body);color:var(--text-primary)}.lbl{font:var(--text-micro);color:var(--text-tertiary);font-family:var(--font-mono);margin-bottom:8px}</style></head>
<body><div id="root"></div><script type="text/babel">
const {ArcSlider,TemperatureDial,Switch,StepperButton,ColorSwatchPicker,TimeRangeField,SearchField}=window.HaloHomeDesignSystem_abaa2b;
function Demo(){const[b,setB]=React.useState(64);const[on,setOn]=React.useState(true);const[off,setOff]=React.useState(false);const[hue,setHue]=React.useState('var(--bulb-yellow)');
return <div style={{display:'flex',flexDirection:'column',gap:16}}>
<div style={{display:'flex',gap:28,alignItems:'flex-start'}}>
<div><div className="lbl">ArcSlider</div><ArcSlider value={b} onChange={setB} size={200}/></div>
<div><div className="lbl">TemperatureDial</div><TemperatureDial value={24} now={15} size={180}/></div>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<div><div className="lbl">Switch</div><div style={{display:'flex',gap:10,alignItems:'center'}}><Switch checked={on} onChange={setOn} label="A"/><Switch checked={off} onChange={setOff} label="B"/><Switch checked size="sm" label="C"/></div></div>
<div><div className="lbl">StepperButton</div><div style={{display:'flex',gap:14}}><StepperButton direction="down"/><StepperButton direction="up"/></div></div>
<div><div className="lbl">ColorSwatchPicker</div><ColorSwatchPicker value={hue} onChange={setHue}/></div></div></div>
<div style={{display:'flex',gap:24,alignItems:'flex-end'}}>
<div><div className="lbl">TimeRangeField</div><TimeRangeField/></div>
<div style={{flex:1}}><div className="lbl">SearchField</div><SearchField/></div></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script></body></html>
