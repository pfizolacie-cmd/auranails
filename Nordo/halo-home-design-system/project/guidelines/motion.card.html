<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="Fast, decelerating, never bouncy" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--espresso-800);font:var(--text-body);color:var(--text-primary)}@keyframes hhslide{0%,12%{transform:translateX(0)}55%,88%{transform:translateX(200px)}100%{transform:translateX(0)}}</style></head><body><div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:14px"><div style="width:150px;font:var(--text-micro);color:var(--text-tertiary);font-family:var(--font-mono)">ease-standard</div><div style="flex:1;position:relative;height:16px"><div style="width:16px;height:16px;border-radius:50%;background:var(--ember-500);box-shadow:var(--glow-ember);animation:hhslide 2.6s cubic-bezier(.32,.72,0,1) infinite"></div></div></div><div style="display:flex;align-items:center;gap:14px"><div style="width:150px;font:var(--text-micro);color:var(--text-tertiary);font-family:var(--font-mono)">ease-out</div><div style="flex:1;position:relative;height:16px"><div style="width:16px;height:16px;border-radius:50%;background:var(--ember-500);box-shadow:var(--glow-ember);animation:hhslide 2.6s cubic-bezier(.16,1,.3,1) infinite"></div></div></div><div style="display:flex;align-items:center;gap:14px"><div style="width:150px;font:var(--text-micro);color:var(--text-tertiary);font-family:var(--font-mono)">ease-glide</div><div style="flex:1;position:relative;height:16px"><div style="width:16px;height:16px;border-radius:50%;background:var(--ember-500);box-shadow:var(--glow-ember);animation:hhslide 2.6s cubic-bezier(.65,0,.35,1) infinite"></div></div></div></div></body></html>
