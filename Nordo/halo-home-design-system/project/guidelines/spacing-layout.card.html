<!-- @dsCard group="Spacing" viewport="700x210" name="Screen layout" subtitle="20px gutters, 12px grid gap, tab bar floats 20px off the bottom" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--espresso-800);font:var(--text-body);color:var(--text-primary)}</style></head><body><div style="width:230px;height:170px;border-radius:var(--radius-lg);border:1px solid var(--line-glass);position:relative;background:var(--umber-500);padding:var(--gutter-screen)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-card)"><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-glass);border:1px solid var(--line-glass-soft)"></div><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-glass);border:1px solid var(--line-glass-soft)"></div><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-glass);border:1px solid var(--line-glass-soft)"></div><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-glass);border:1px solid var(--line-glass-soft)"></div></div>
<div style="position:absolute;left:var(--gutter-screen);right:var(--gutter-screen);bottom:var(--gutter-screen);height:34px;border-radius:var(--radius-pill);background:var(--surface-glass);border:1px solid var(--line-glass-soft)"></div></div></body></html>
