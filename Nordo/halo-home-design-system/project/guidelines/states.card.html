<!-- @dsCard group="Brand" viewport="700x170" name="Interaction states" subtitle="Hover brightens, press shrinks to 0.96, selection inverts to porcelain" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--espresso-800);font:var(--text-body);color:var(--text-primary)}</style></head><body><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--surface-glass);border:1px solid var(--line-glass-soft);font:var(--text-label);color:var(--text-secondary)">idle</span>
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--surface-glass);border:1px solid var(--line-glass-soft);font:var(--text-label);color:var(--text-primary);filter:brightness(1.08)">hover</span>
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--surface-glass);border:1px solid var(--line-glass-soft);font:var(--text-label);color:var(--text-primary);transform:scale(.96);display:inline-block">press</span>
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--surface-solid);font:var(--text-label);color:var(--text-inverse);box-shadow:var(--shadow-sm)">selected</span>
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--surface-glass);border:1px solid var(--line-glass-soft);font:var(--text-label);color:var(--text-secondary);opacity:.4">disabled</span>
<span style="padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--grad-ember);font:var(--text-label);color:var(--accent-on);box-shadow:var(--glow-ember)">on / lit</span></div></body></html>
