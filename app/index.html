<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Aura Nails</title>
<meta name="description" content="Aura Nails — rezervácie, vernostný program a cenník nechtového štúdia v Handlovej.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aura Nails">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/aura-design.css">

<style>
  html, body { margin: 0; height: 100%; background: var(--porcelain); overscroll-behavior: none; }
  #root { min-height: 100vh; max-width: 480px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,.06); }
  a { color: var(--espresso); }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; box-sizing: border-box; }
</style>

<!-- React (no build step needed) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase (real database, so data persists between visits) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="root"><div style="min-height:100vh;max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--porcelain, #F7F2EF);font-family:var(--font-sans, 'Jost', sans-serif);color:var(--ink-3, #9D8B84);font-size:.85rem;letter-spacing:.02em;">
  <span style="display:inline-flex;align-items:center;gap:8px;">
    <span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--line-gold, rgba(62,39,39,.3));border-top-color:var(--mocha, #8C6E62);animation:spin .8s linear infinite;"></span>
    Načítavam…
  </span>
</div></div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script type="text/babel" src="/notifications.js?v=1"></script>
<script type="text/babel" src="app.jsx?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
