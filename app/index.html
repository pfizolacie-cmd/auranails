<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Aura Nails</title>
<meta name="description" content="Aura Nails — rezervácie, vernostný program a cenník nechtového štúdia v Handlovej.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17100F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aura Nails">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/aura-design.css">
<link rel="stylesheet" href="espresso-night.css?v=27">

<style>
  html, body { margin: 0; height: 100%; background: var(--porcelain); overscroll-behavior: none; }
  #root { min-height: 100vh; max-width: 282px; margin: 0 auto; box-shadow: 0 0 80px rgba(0,0,0,.5); position: relative; }
  html, body { overflow-x: hidden; }
  a { color: var(--espresso); }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; box-sizing: border-box; }
</style>

<!-- React (no build step needed) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<!-- Recharts (data visualization) -->
<script src="https://unpkg.com/recharts@2.10.3/dist/recharts.js"></script>

<!-- Firebase (real database, so data persists between visits) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="root"><div style="min-height:calc(100vh / var(--z, 1));max-width:282px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--porcelain, #17100F);font-family:var(--font-sans, 'Inter', sans-serif);color:var(--ink-3, #9C8981);font-size:.85rem;letter-spacing:.02em;">
  <span style="display:inline-flex;align-items:center;gap:8px;">
    <span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--line-gold, rgba(217,185,155,.26));border-top-color:var(--espresso, #D9B99B);animation:spin .8s linear infinite;"></span>
    Načítavam…
  </span>
</div></div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>
  // Appka je navrhnutá na šírku 282 px (presne ako schválený náhľad) a na telefóne
  // sa celá proporcionálne zväčší na šírku displeja – vyzerá tak 1:1 ako návrh.
  (function () {
    function fit() {
      var r = document.getElementById('root'); if (!r) return;
      var w = Math.min(window.innerWidth || 390, 480);
      var z = w / 282;
      r.style.zoom = z;
      r.style.minHeight = (window.innerHeight / z) + 'px';
      document.documentElement.style.setProperty('--z', z);
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  })();
</script>
<script>
  // KRITICKÁ OPRAVA: Babel Standalone z CDN (bez pripnutej verzie) môže defaultne
  // prepnúť na "automatic" JSX runtime, ktorý vkladá require("react/jsx-runtime") —
  // to v prehliadači neexistuje a appka nepredvídateľne spadne. Vynucujeme "classic"
  // runtime explicitne, nech CDN servíruje akúkoľvek verziu Babelu.
  async function loadBabelScript(url) {
    const res = await fetch(url, { cache: 'no-store' });
    const src = await res.text();
    const { code } = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]],
      filename: url,
    });
    (0, eval)(code);
  }
  (async () => {
    try {
      await loadBabelScript('/notifications.js');
      await loadBabelScript('Statistics.jsx');
      await loadBabelScript('app.jsx');
    } catch (e) {
      console.error('App load error:', e);
      document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;color:#F1E6DF;background:#17100F;">Niečo sa pokazilo pri načítaní. Skúste obnoviť stránku.</div>';
    }
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
